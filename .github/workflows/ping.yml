name: Start attendance punch

# Public repo: this is the only clock. No passwords.
# One run per punch, Sunday-Thursday, at 10:00 and 18:00 Cairo.
on:
  schedule:
    - cron: "0 10 * * 0-4"
      timezone: "Africa/Cairo"
    - cron: "0 18 * * 0-4"
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      mode:
        description: "Punch type"
        type: choice
        options: [in, out]
        default: out

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start the private attendance workflow
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "!! DISPATCH_TOKEN secret is missing"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            HOUR=$(printf '%s' "$SCHEDULE" | awk '{print $2}')
            case "$HOUR" in
              18) MODE=out ;;
              *) MODE=in ;;
            esac
          fi
          echo "Dispatching check-$MODE (schedule: ${SCHEDULE:-manual})"
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mohamed-kharashy/nova-hr-attendance-cron/actions/workflows/attendance.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$MODE\",\"dry_run\":\"false\",\"wait\":\"true\"}}"
          echo "Dispatch accepted"
