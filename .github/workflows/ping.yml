name: Start attendance punch

# Public repo: GitHub runs scheduled workflows here.
# No passwords. This only starts the private attendance repo.
on:
  schedule:
    # Several minutes, so one dropped slot still punches. Sunday-Thursday.
    - cron: "15,25,35,45 9 * * 0-4"
      timezone: "Africa/Cairo"
    - cron: "15,25,35,45 17 * * 0-4"
      timezone: "Africa/Cairo"
    # UTC backups if a timezone schedule is ignored.
    # The private repo waits until 10:00 or 18:00 and punches only once.
    - cron: "15,25,35,45 6 * * 0-4"
    - cron: "15,25,35,45 7 * * 0-4"
    - cron: "15,25,35,45 14 * * 0-4"
    - cron: "15,25,35,45 15 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Punch type"
        type: choice
        options: [in, out]
        default: out

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start the private attendance workflow
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "!! DISPATCH_TOKEN secret is missing"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            HOUR=$(printf '%s' "$SCHEDULE" | awk '{print $2}')
            case "$HOUR" in
              17|14|15) MODE=out ;;
              *) MODE=in ;;
            esac
          fi
          echo "Dispatching check-$MODE (schedule: ${SCHEDULE:-manual})"
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mohamed-kharashy/nova-hr-attendance-cron/actions/workflows/attendance.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$MODE\",\"dry_run\":\"false\",\"wait\":\"true\"}}"
          echo "Dispatch accepted"
